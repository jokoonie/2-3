<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>2-3</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <style>
        :root {
            --primary-color: #7c9082;
            --primary-hover: #677b6d;
            --bg-color: #f7f5f0;
            --card-bg: #ffffff;
            --border-color: #e3ded6;
            --text-color: #4a453e;
        }

        body {
            font-family: 'Apple SD Gothic Neo', sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 15px;
            background-color: var(--bg-color);
            color: var(--text-color);
            position: relative;
        }

        h1, h2 { color: var(--text-color); }
        h1 { color: var(--primary-color); font-size: 1.5rem; }

        .card {
            background: var(--card-bg);
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }

        label { display: block; margin-top: 10px; font-weight: bold; }

        textarea, input[type="text"], input[type="range"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            background: #fcfbfa;
            color: var(--text-color);
            font-size: 16px;
        }
        textarea { height: 120px; resize: vertical; }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            margin-top: 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background-color: var(--primary-hover); }

        .tag-badge {
            display: inline-block;
            background: #ede8df;
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 15px;
            margin: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid var(--border-color);
        }
        .tag-badge.selected {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .blank-input {
            width: 55px !important;
            min-width: 45px;
            max-width: 80px;
            padding: 4px;
            margin: 0 2px;
            border: 1px solid #c4bcae;
            border-radius: 4px;
            text-align: center;
            font-size: 0.9rem;
            display: inline-block;
            background: #fff;
        }

        .result-item { margin-bottom: 12px; line-height: 1.8; }
        .passage-header { font-weight: bold; font-size: 1.15em; color: var(--text-color); margin: 15px 0 8px 0; }
        .passage-subheader { font-weight: bold; color: var(--primary-color); margin: 10px 0 5px 0; }
        del { color: #d98880; text-decoration: line-through; margin-right: 4px; }
        .correct-answer { color: #536447; font-weight: bold; margin-left: 4px; }

        .top-manage-btn {
            position: absolute;
            top: 20px;
            right: 15px;
            background-color: #ede8df;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            font-size: 13px;
            margin-top: 0;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(74, 69, 62, 0.4);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content, .sub-modal-content {
            background: var(--card-bg);
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 1px solid var(--border-color);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .close-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #6e6559;
            margin-top: 0;
            padding: 0;
        }
        .passage-list-container {
            overflow-y: auto;
            max-height: 50vh;
            flex-grow: 1;
        }
        .passage-list-item {
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .passage-info { flex-grow: 1; overflow: hidden; font-size: 14px; }
        .passage-preview-text {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }
        .action-btns { display: flex; gap: 5px; flex-shrink: 0; }
        .detail-btn { background-color: var(--primary-color); padding: 4px 8px; font-size: 11px; margin-top: 0; }
        .edit-btn { background-color: #d4ac0d; padding: 4px 8px; font-size: 11px; margin-top: 0; }
        .delete-btn { background-color: #d98880; padding: 4px 8px; font-size: 11px; margin-top: 0; }
    </style>
</head>
<body>

    <button class="top-manage-btn" onclick="openModal()">지문 관리</button>
    <h1>2-3</h1>

    <div class="card">
        <h2 id="formTitle">1. 지문 등록하기</h2>
        <input type="hidden" id="editingId" value="">

        <label for="passageText">지문 내용</label>
        <textarea id="passageText" placeholder="# 헤더 내용&#10;1. 소목차 내용&#10;일반 문단 내용..."></textarea>
        
        <label for="passageTags">해시태그 (쉼표로 구분)</label>
        <input type="text" id="passageTags" placeholder="예: 형법, 총론, 위법성조각사유">
        
        <button id="saveButton" onclick="savePassage()">지문 저장하기</button>
        <button id="cancelEditButton" onclick="cancelEdit()" style="background-color: #95a5a6; display: none;">수정 취소</button>
    </div>

    <div class="card">
        <h2>2. 암기 학습하기</h2>
        <p style="font-size: 14px;">학습할 해시태그를 클릭하세요:</p>
        <div id="tagFilterContainer"></div>

        <div style="margin-top: 15px;">
            <label for="blankRatio">빈칸 비율 (<span id="ratioValue">30</span>%)</label>
            <input type="range" id="blankRatio" min="10" max="70" value="30" oninput="document.getElementById('ratioValue').innerText = this.value">
        </div>
    </div>

    <div class="card" id="quizCard" style="display:none;">
        <h2>3. 빈칸 채우기</h2>
        <div id="quizContainer"></div>
        <button onclick="submitQuiz()">정답 제출하기</button>
    </div>

    <div class="modal-overlay" id="manageModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>저장된 지문 관리</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="passage-list-container" id="managePassageContainer"></div>
        </div>
    </div>

    <div class="modal-overlay" id="detailModal">
        <div class="sub-modal-content">
            <div class="modal-header">
                <h2 id="detailTitle">지문 전문</h2>
                <button class="close-btn" onclick="closeDetailModal()">&times;</button>
            </div>
            <p id="detailTextContent" style="font-size: 14px; white-space: pre-wrap;"></p>
        </div>
    </div>

    <script>
        let passages = JSON.parse(localStorage.getItem('passages_v2')) || [];

        window.onload = function() {
            renderTagFilters();
            renderManageList();
        };

        function openModal() {
            document.getElementById('manageModal').style.display = 'flex';
            renderManageList();
        }

        function closeModal() {
            document.getElementById('manageModal').style.display = 'none';
        }

        function openDetailModal(text) {
            document.getElementById('detailTextContent').innerText = text;
            document.getElementById('detailModal').style.display = 'flex';
        }

        function closeDetailModal() {
            document.getElementById('detailModal').style.display = 'none';
        }

        function savePassage() {
            const editingId = document.getElementById('editingId').value;
            const text = document.getElementById('passageText').value.trim();
            const tagsInput = document.getElementById('passageTags').value.trim();

            if (!text || !tagsInput) {
                alert('지문과 해시태그를 모두 입력해주세요.');
                return;
            }

            const tags = tagsInput.split(',').map(tag => tag.trim()).filter(tag => tag.length > 0);

            if (editingId) {
                const index = passages.findIndex(p => p.id == editingId);
                if (index !== -1) {
                    passages[index].text = text;
                    passages[index].tags = tags;
                }
                alert('지문이 수정되었습니다!');
                cancelEdit();
            } else {
                const newPassage = { id: Date.now(), text, tags };
                passages.push(newPassage);
                alert('지문이 저장되었습니다!');
                document.getElementById('passageText').value = '';
                document.getElementById('passageTags').value = '';
            }

            localStorage.setItem('passages_v2', JSON.stringify(passages));
            renderTagFilters();
            renderManageList();
        }

        function editPassage(id) {
            const passage = passages.find(p => p.id === id);
            if (!passage) return;

            document.getElementById('editingId').value = passage.id;
            document.getElementById('passageText').value = passage.text;
            document.getElementById('passageTags').value = passage.tags.join(', ');

            document.getElementById('formTitle').innerText = '1. 지문 수정하기';
            document.getElementById('saveButton').innerText = '수정 완료하기';
            document.getElementById('cancelEditButton').style.display = 'inline-block';

            closeModal();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEdit() {
            document.getElementById('editingId').value = '';
            document.getElementById('passageText').value = '';
            document.getElementById('passageTags').value = '';
            document.getElementById('formTitle').innerText = '1. 지문 등록하기';
            document.getElementById('saveButton').innerText = '지문 저장하기';
            document.getElementById('cancelEditButton').style.display = 'none';
        }

        function renderManageList() {
            const container = document.getElementById('managePassageContainer');
            container.innerHTML = '';

            if (passages.length === 0) {
                container.innerHTML = '<p style="color:#7e7364; font-size:14px; padding: 20px; text-align: center;">저장된 지문이 없습니다.</p>';
                return;
            }

            passages.forEach(passage => {
                const item = document.createElement('div');
                item.className = 'passage-list-item';

                const info = document.createElement('div');
                info.className = 'passage-info';
                
                const previewText = passage.text.replace(/[\n\r]+/g, ' ');
                info.innerHTML = `
                    <div class="passage-preview-text"><strong>${previewText}</strong></div>
                    <span style="color: #7e7364; font-size: 12px;">[${passage.tags.join(', ')}]</span>
                `;

                const actionBtns = document.createElement('div');
                actionBtns.className = 'action-btns';

                const detailBtn = document.createElement('button');
                detailBtn.className = 'detail-btn';
                detailBtn.innerText = '상세';
                detailBtn.onclick = () => openDetailModal(passage.text);

                const editBtn = document.createElement('button');
                editBtn.className = 'edit-btn';
                editBtn.innerText = '수정';
                editBtn.onclick = () => editPassage(passage.id);

                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.innerText = '삭제';
                delBtn.onclick = () => deletePassage(passage.id);

                actionBtns.appendChild(detailBtn);
                actionBtns.appendChild(editBtn);
                actionBtns.appendChild(delBtn);

                item.appendChild(info);
                item.appendChild(actionBtns);
                container.appendChild(item);
            });
        }

        function deletePassage(id) {
            if (!confirm('이 지문을 정말 삭제하시겠습니까?')) return;

            passages = passages.filter(p => p.id !== id);
            localStorage.setItem('passages_v2', JSON.stringify(passages));

            renderTagFilters();
            renderManageList();
            document.getElementById('quizCard').style.display = 'none';
        }

        function renderTagFilters() {
            const container = document.getElementById('tagFilterContainer');
            container.innerHTML = '';

            let allTags = [];
            passages.forEach(p => {
                p.tags.forEach(t => {
                    if (!allTags.includes(t)) allTags.push(t);
                });
            });

            if (allTags.length === 0) {
                container.innerHTML = '<p style="color:#7e7364; font-size:14px;">저장된 지문이 없습니다. 먼저 지문을 등록해주세요.</p>';
                return;
            }

            allTags.forEach(tag => {
                const badge = document.createElement('span');
                badge.className = 'tag-badge';
                badge.innerText = `#${tag}`;
                badge.onclick = () => {
                    document.querySelectorAll('.tag-badge').forEach(b => b.classList.remove('selected'));
                    badge.classList.add('selected');
                    startQuizByTag(tag);
                };
                container.appendChild(badge);
            });
        }

        function startQuizByTag(tag) {
            const filtered = passages.filter(p => p.tags.includes(tag));
            if (filtered.length === 0) return;

            const targetPassage = filtered[Math.floor(Math.random() * filtered.length)];
            const ratio = parseInt(document.getElementById('blankRatio').value) / 100;

            generateQuizHtml(targetPassage.text, ratio);
            document.getElementById('quizCard').style.display = 'block';
        }

        function generateQuizHtml(text, ratio) {
            const quizContainer = document.getElementById('quizContainer');
            quizContainer.innerHTML = '';

            const lines = text.split('\n');

            lines.forEach((line, sIdx) => {
                const trimmed = line.trim();
                if (!trimmed) return;

                if (trimmed.startsWith('#')) {
                    const headerDiv = document.createElement('div');
                    headerDiv.className = 'passage-header';
                    headerDiv.textContent = trimmed.replace('#', '').trim();
                    quizContainer.appendChild(headerDiv);
                    return;
                }

                if (/^(\d+[\.\)]|[①-⑳]|[\가-하]\.)/.test(trimmed)) {
                    const subHeaderDiv = document.createElement('div');
                    subHeaderDiv.className = 'passage-subheader';
                    subHeaderDiv.textContent = trimmed;
                    quizContainer.appendChild(subHeaderDiv);
                    return;
                }

                let words = trimmed.split(/\s+/);
                let eligibleIndices = [];
                
                words.forEach((word, idx) => {
                    let cleanWord = word.replace(/["'“”‘’]/g, '');
                    let hasSingleSyl = cleanWord.length <= 1; 
                    let hasNum = /\d/.test(word);            
                    let hasQuote = /["'“”‘’]/.test(word);    

                    if (!hasSingleSyl && !hasNum && !hasQuote) {
                        eligibleIndices.push(idx);
                    }
                });

                let blankCount = Math.max(1, Math.floor(words.length * ratio));
                let blankIndices = [];
                
                while (blankIndices.length < blankCount && eligibleIndices.length > 0) {
                    let randPoolIdx = Math.floor(Math.random() * eligibleIndices.length);
                    let targetWordIdx = eligibleIndices.splice(randPoolIdx, 1)[0];
                    if (!blankIndices.includes(targetWordIdx)) {
                        blankIndices.push(targetWordIdx);
                    }
                }

                const p = document.createElement('div');
                p.className = 'result-item';

                words.forEach((word, wIdx) => {
                    if (blankIndices.includes(wIdx)) {
                        const inputId = `blank_${sIdx}_${wIdx}`;
                        p.innerHTML += `<input type="text" class="blank-input" id="${inputId}" data-answer="${word}"> `;
                    } else {
                        p.innerHTML += word + ' ';
                    }
                });

                quizContainer.appendChild(p);
            });
        }

        function submitQuiz() {
            const inputs = document.querySelectorAll('.blank-input');
            
            inputs.forEach(input => {
                const userVal = input.value.trim();
                const correctVal = input.getAttribute('data-answer');
                const span = document.createElement('span');

                if (userVal === correctVal) {
                    span.innerHTML = `<b style="color: var(--primary-hover);">${correctVal}</b>`;
                } else {
                    span.innerHTML = `<del>${userVal || '(공백)'}</del><span class="correct-answer">(${correctVal})</span>`;
                }
                input.replaceWith(span);
            });

            alert('채점이 완료되었습니다!');
        }
    </script>
</body>
</html>
